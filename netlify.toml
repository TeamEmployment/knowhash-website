# knowhash.com — Netlify config
# Settings here override the Build settings in the Netlify dashboard.

[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/build-guides-index.js"

# Always serve a fresh guides list so new guides appear straight after a deploy
[[headers]]
  for = "/guides/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# knowhash Role morning digest — 20:00 UTC = 7am Melbourne in daylight
# saving (Oct–Apr), 6am otherwise.
[functions."role-digest"]
  schedule = "0 20 * * *"
