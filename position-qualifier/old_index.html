<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Position Qualifier — knowhash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #22355c;
    --teal: #0d5c63;
    --teal-light: #e6f0ef;
    --ink: #2a2f36;
    --muted: #6b7480;
    --bg: #f7f8fa;
    --line: #e3e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 {
    font-family: 'Comfortaa', sans-serif;
    font-weight: 700;
    color: var(--navy);
    font-size: 26px;
    margin: 0 0 6px;
  }
  .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 36px; }

  /* Loading state */
  #loading { text-align: center; padding: 80px 20px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 22px;
    border: 3px solid var(--line); border-top-color: var(--teal);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-message { color: var(--muted); font-size: 14.5px; transition: opacity 0.3s ease; }

  /* Result state */
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 30px; margin-bottom: 24px;
  }
  .card h2 {
    font-family: 'Comfortaa', sans-serif; font-size: 17px; color: var(--navy);
    margin: 0 0 4px;
  }
  .card .tagline { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: none; }
  .item .q { font-size: 14.5px; font-weight: 500; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .type-open { display: inline-block; font-size: 11px; color: var(--teal); background: var(--teal-light); padding: 1px 8px; border-radius: 10px; margin-left: 8px; }

  .link-row {
    display: flex; gap: 10px; align-items: center;
    background: var(--teal-light); border-radius: 10px; padding: 14px 16px;
  }
  .link-row input {
    flex: 1; border: none; background: transparent; font-size: 13.5px;
    color: var(--navy); font-family: 'Inter', monospace;
  }
  .link-row input:focus { outline: none; }
  button.copy {
    background: var(--teal); color: #fff; border: none; border-radius: 7px;
    padding: 8px 16px; font-size: 13.5px; font-weight: 500; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button.copy:hover { background: #0a4a50; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .response-row { cursor: pointer; }
  .response-row:hover td { background: var(--teal-light); }
  .chevron { width: 20px; color: var(--muted); font-size: 16px; text-align: center; }
  .response-detail td { border-bottom: 1px solid var(--line); padding: 0 0 14px; }
  .answer-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .answer-item:first-child { border-top: none; }
  .answer-q { font-size: 13.5px; font-weight: 500; margin-bottom: 3px; }
  .answer-a { font-size: 14px; color: var(--navy); white-space: pre-wrap; }
  button.download {
    margin-top: 12px; background: transparent; color: var(--teal); border: 1px solid var(--teal);
    border-radius: 7px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  button.download:hover { background: var(--teal-light); }
  .empty-state { color: var(--muted); font-size: 14px; padding: 8px 0; }

  #error { text-align: center; padding: 60px 20px; color: var(--muted); }
  #error button {
    margin-top: 14px; background: var(--navy); color: #fff; border: none;
    border-radius: 7px; padding: 9px 20px; font-size: 14px; cursor: pointer;
  }

  footer { text-align: center; margin-top: 40px; }
  footer span { font-size: 12px; color: var(--muted); }
  footer strong { color: var(--navy); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Position Qualifier</h1>
  <p class="subtitle">Your screening questions, ready to send.</p>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-message">Reading the role…</div>
  </div>

  <div id="error" style="display:none">
    <p>Something went wrong loading this page.</p>
    <button onclick="load()">Try again</button>
  </div>

  <div id="content" style="display:none"></div>

  <footer><span>Powered by <strong>knowhash</strong></span></footer>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const loadingMessages = [
  { delay: 0,     text: "Reading the role…" },
  { delay: 3000,  text: "Building your screening questions…" },
  { delay: 7000,  text: "Structuring the sections…" },
  { delay: 11000, text: "Almost there…" },
  { delay: 15000, text: "Still working — first-time generation can take a little longer than usual" },
];
const msgEl = document.getElementById('loading-message');
let msgTimeouts = [];

function startLoadingMessages() {
  msgEl.textContent = loadingMessages[0].text;
  msgTimeouts = loadingMessages.slice(1).map(({ delay, text }) =>
    setTimeout(() => {
      msgEl.style.opacity = 0;
      setTimeout(() => { msgEl.textContent = text; msgEl.style.opacity = 1; }, 300);
    }, delay)
  );
}

function stopLoadingMessages() {
  msgTimeouts.forEach(clearTimeout);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderSections(sections) {
  return sections.map(section => `
    <div class="card">
      <h2>${escapeHtml(section.title)}</h2>
      <p class="tagline">${escapeHtml(section.tagline)}</p>
      ${section.items.map(item => `
        <div class="item">
          <div class="q">${escapeHtml(item.question)}${item.type === 'open' ? '<span class="type-open">Open answer</span>' : ''}</div>
          <div class="sub">${escapeHtml(item.subtext || '')}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

let currentResponses = [];
let currentRoleTitle = '';

function renderResponses(responses) {
  currentResponses = responses;
  if (!responses || responses.length === 0) {
    return `<div class="card"><h2>Responses</h2><p class="empty-state">No responses yet — share the link above with a candidate to get started.</p></div>`;
  }
  return `
    <div class="card">
      <h2>Responses (${responses.length})</h2>
      <table>
        <tr><th></th><th>Candidate</th><th>Email</th><th>Received</th></tr>
        ${responses.map((r, idx) => `
          <tr class="response-row" onclick="toggleResponse(${idx})">
            <td class="chevron" id="chevron-${idx}">›</td>
            <td>${escapeHtml(r.cre5b_candidate_name || 'Not given')}</td>
            <td>${escapeHtml(r.cre5b_candidate_email || '—')}</td>
            <td>${new Date(r.createdon).toLocaleDateString()}</td>
          </tr>
          <tr class="response-detail" id="detail-${idx}" style="display:none">
            <td colspan="4">
              ${renderAnswers(r.cre5b_answers)}
              <button class="download" onclick="event.stopPropagation(); downloadResponse(${idx})">Download copy</button>
            </td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;
}

function downloadResponse(idx) {
  const r = currentResponses[idx];
  let answers;
  try { answers = JSON.parse(r.cre5b_answers); } catch (e) { answers = []; }
  const lines = [
    `Position Qualifier — ${currentRoleTitle}`,
    `Candidate: ${r.cre5b_candidate_name || 'Not given'}`,
    `Email: ${r.cre5b_candidate_email || '—'}`,
    `Received: ${new Date(r.createdon).toLocaleString()}`,
    '',
    ...answers.flatMap(a => [a.question, a.answer || '(skipped)', ''])
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(r.cre5b_candidate_name || 'candidate').replace(/\s+/g, '-')}-response.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderAnswers(answersJson) {
  let answers;
  try { answers = JSON.parse(answersJson); } catch (e) { return '<p class="empty-state">Could not read this response.</p>'; }
  return answers.map(a => `
    <div class="answer-item">
      <div class="answer-q">${escapeHtml(a.question)}</div>
      <div class="answer-a">${escapeHtml(a.answer || '(skipped)')}</div>
    </div>
  `).join('');
}

function toggleResponse(idx) {
  const detail = document.getElementById(`detail-${idx}`);
  const chevron = document.getElementById(`chevron-${idx}`);
  const open = detail.style.display !== 'none';
  detail.style.display = open ? 'none' : '';
  chevron.textContent = open ? '›' : '⌄';
}

async function load(retry) {
  document.getElementById('loading').style.display = '';
  document.getElementById('error').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  startLoadingMessages(); // fresh sequence each attempt, including on retry

  if (!token) {
    stopLoadingMessages();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
    document.querySelector('#error p').textContent = 'This link is missing its access code.';
    return;
  }

  try {
    const forceRegenerate = params.get('regenerate') === 'true';
    const url = `/.netlify/functions/qualifier-generate-or-fetch?token=${encodeURIComponent(token)}${forceRegenerate ? '&regenerate=true' : ''}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    stopLoadingMessages();
    const candidateUrl = `${window.location.origin}/position-qualifier/apply/?token=${data.candidateLinkToken}`;
    currentRoleTitle = data.roleTitle;

    document.getElementById('content').innerHTML = `
      <div class="card">
        <h2>Share with candidates</h2>
        <p class="tagline">Anyone with this link can take the test for ${escapeHtml(data.roleTitle)}.</p>
        <div class="link-row">
          <input readonly value="${candidateUrl}" id="candidate-link">
          <button class="copy" onclick="copyLink()">Copy link</button>
        </div>
      </div>
      ${renderSections(data.questions.sections)}
      ${renderResponses(data.responses)}
    `;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
  } catch (err) {
    if (!retry) { load(true); return; } // one silent automatic retry
    stopLoadingMessages();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
  }
}

function copyLink() {
  const input = document.getElementById('candidate-link');
  input.select();
  navigator.clipboard.writeText(input.value);
  const btn = document.querySelector('button.copy');
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = original, 1500);
}

load();
</script>
</body>
</html>
